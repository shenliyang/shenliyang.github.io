name: Deploy Hexo-theme-snippet to GitHub Pages

on:
  push:
    branches: [dev]  # 只在dev分支推送时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: dev  # 明确指定检出dev分支

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'  # Hexo推荐使用Node.js 12+

    - name: Install Hexo and dependencies
      run: |
        npm install -g hexo-cli
        npm install

    - name: Build static files
      run: |
        hexo clean
        hexo generate

    # 部署到gh-pages分支
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public  # Hexo默认生成的静态文件目录
        publish_branch: gh-pages  # 部署的目标分支
        
